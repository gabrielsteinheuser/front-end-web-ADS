<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recrutamento Online</title>
</head>
    <body>
        <header>
            <h1>Recrutamento Online</h1>
        </header>
        <main> 
            <selection>
                <h2>Cadastre seu currículo</h2>
                <form action="#" method="get">
                    <p>Preencha o formulário para se canditadar à vaga</p>
                    <fieldset>
                        <legend>Dados Pessoais</legend>
                        <div>
                            <label for="nome_id">Nome completo</label>
                            <input id="nome_id" name="nome" type="text">
                        </div>
                        <hr>
                        <div>
                            <label for="telefone_id">Telefone:</label>
                            <input id="telefone_id" name="telefone" type="tel">
                        </div>
                        <hr>
                        <div>
                            <label for="email_id">Email:</label>
                            <input id="email_id" name="email" type="email">
                        </div>
                        <hr>
                         <div>
                            <label for="data_nasc_id">Data nascimento:</label>
                            <input id="data_nasc_id" name="data" type="date">
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Endereço</legend>
                        <hr>
                        <div>
                            <label for="logradouro_id">Logradouro</label>
                            <input id="logradouro_id" name="logradouro" type="text">
                        </div>
                        <hr>
                        <div>
                            <label for="cidade_id">Cidade-UF</label>
                            <input id="cidade_id" name="cidade" type="text">
                        </div>
                        <hr>
                         <div>
                            <label for="numero_id">Número:</label>
                            <input id="numero_id" name="numero" type="number">
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Biografia</legend>
                        <div>
                            <label for="resumo_id">Fale mais sobre você</label>
                            <textarea id="resumo_id" 
                                      name="resumo" 
                                      rows="10" 
                                      cols="50"
                            ></textarea>  
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Nível pretendido</legend>
                        <div>
                            <input id="estagiario_id" name="nivel" type="radio" value="estagiario">
                            <label for="estagiario_id">Estagiário</label>
                        </div>
                        <div>
                            <input id="junior_id" name="nivel" type="radio" value="junior">
                            <label for="junior_id">Júnior</label>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Tecnologias</legend>
                        <div>
                            <input id="tec_html_id" name="tecnologia" type="checkbox" value="html">
                            <label for="tec_html_id">HTML</label>
                        </div>
                        <div>
                            <input id="tec_css_id" name="tecnologia" type="checkbox" value="css">
                            <label for="tec_css_id">CSS</label>
                        </div>
                        <div>
                            <input id="tec_js_id" name="tecnologia" type="checkbox" value="js">
                            <label for="tec_js_id">JavaScript</label>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Grau de instrução</legend>
                        <div>
                            <label for="escolaridade_id">Escolaridade:</label>
                            <select id="escolaridade_id" name="escolaridade">
                                <option value="medio">Ensino Médio</option>
                                <option value="graduacao">Graduação</option>
                                <option value="pos">Pós-graduação</option>
                            </select>
                        </div>
                    </fieldset>
                    <div>
                    <hr>
                    <center>
                        <button type="reset">Limpar dados</button>
                        <button type="enviar">Enviar candidatura</button>
                    </center>
                    </div>
                </form>
            </selection>
        </main>
        <footer>
        <center>    <p>Todos os direitos reservados!</p>    </center>
        </footer>
    </body>
</html>
