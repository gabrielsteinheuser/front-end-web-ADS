<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles/global.css">
  <script src="./scripts/index.js" defer></script>
  <title>Meus Jogos</title>
</head>
<body>
  <header>
    <h1>Meus jogos</h1>
  </header>
  <main>
    <section class="container-cards">
      <div class="card" id="free-fire">
        <h2>Free Fire</h2>
        <p>Battle Royale</p>
        <button onclick="marcar('free-fire','Free-Fire')">Click</button>
      </div>

      <div class="card" id="lol">
        <h2>League Of Legends</h2>
        <p>MOBA</p>
        <button onclick="marcar('lol','League Of Legends')">Click</button>
      </div>

      <div class="card" id="valorant">
        <h2>Valorant</h2>
        <p>Tiro tatico</p>
        <button onclick="marcar('valorant','Valorant')">Click</button>
      </div>

      <div class="card" id="minecraft">
        <h2>Minecraft</h2>
        <p>Construção e sobrevivência</p>
        <button onclick="marcar('minecraft','Minecraft')">Click</button>
      </div>

      <div class="card" id="fortnite">
        <h2>Fortnite</h2>
        <p>Battle Royale</p>
        <button onclick="marcar('fortnite','Fortnite')">Click</button>
      </div>

      <div class="card" id="fifa">
        <h2>FIFA</h2>
        <p>Futebol</p>
        <button onclick="marcar('fifa','FIFA')">Click</button>
      </div>

    </section>
  </main>
  <footer>
    <p>Projeto para conhecermos media queries e localStorage</p>
  </footer>

</body>
</html>
